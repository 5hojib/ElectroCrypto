name: Build and Release Wheels

on: [push]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v3

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel twine setuptools

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
          CIBW_TEST_REQUIRES: tox
          CIBW_TEST_COMMAND: cd {project} && tox
          CIBW_TEST_SKIP: "*-win*"
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Release to PyPI
        run: python -m twine upload wheelhouse/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  build_arm_wheels:
    name: Build ARM64 wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU for ARM64 emulation
        run: |
          sudo apt update
          sudo apt install -y qemu-user-static

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel twine setuptools

      - name: Build ARM64 wheels using manylinux
        run: |
          docker run --rm --platform linux/arm64 \
            -v $(pwd):/project \
            -w /project \
            quay.io/pypa/manylinux2014_aarch64 \
            /bin/bash -c "python3 -m cibuildwheel --output-dir wheelhouse"
        env:
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_TEST_REQUIRES: tox
          CIBW_TEST_COMMAND: cd {project} && tox
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload ARM64 wheels as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: arm64-wheels
          path: wheelhouse/*.whl

      - name: Release ARM64 wheels to PyPI
        run: python -m twine upload wheelhouse/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  build_source:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v3

      - name: Install twine
        run: python -m pip install twine setuptools

      - name: Build source distribution
        run: python setup.py sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v3
        with:
          name: source-dist
          path: dist/*.tar.gz

      - name: Release source distribution to PyPI
        run: python -m twine upload dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}